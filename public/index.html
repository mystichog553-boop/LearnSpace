<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background: #171923;
            padding: 20px;
            border-right: 1px solid #292c38;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .new-chat {
            width: 100%;
            padding: 13px;
            background: #252938;
            color: white;
            border: 1px solid #393d4d;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .new-chat:hover {
            background: #323749;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #292c38;
            font-size: 18px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .welcome {
            margin: auto;
            text-align: center;
            max-width: 500px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #a1a5b5;
            line-height: 1.6;
        }

        .message {
            max-width: 750px;
            width: fit-content;
            padding: 15px 18px;
            border-radius: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #34394c;
            align-self: flex-end;
        }

        .ai {
            background: #191c26;
            border: 1px solid #292c38;
            align-self: flex-start;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #292c38;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
            background: #191c26;
            border: 1px solid #393d4d;
            border-radius: 14px;
            padding: 10px;
        }

        #message {
            flex: 1;
            background: transparent;
            color: white;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            min-width: 0;
        }

        #send {
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-size: 15px;
        }

        #send:hover {
            background: #827aff;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .disclaimer {
            text-align: center;
            color: #777d90;
            font-size: 12px;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .sidebar {
                display: none;
            }

            #chat {
                padding: 18px;
            }

            .welcome h1 {
                font-size: 28px;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">✦ SchoolAI</div>
        <button class="new-chat" onclick="newChat()">
            + New chat
        </button>
    </aside>

    <main class="main">

        <header>AI Assistant</header>

        <div id="chat">
            <div class="welcome" id="welcome">
                <h1>What's on your mind?</h1>
                <p>
                    Ask questions, learn something new,
                    get help with homework, or just chat.
                </p>
            </div>
        </div>

        <div class="input-area">
            <form class="input-box" id="form">
                <textarea
                    id="message"
                    placeholder="Message SchoolAI..."
                    rows="1"
                    required
                ></textarea>

                <button id="send" type="submit">
                    Send ↑
                </button>
            </form>

            <div class="disclaimer">
                SchoolAI can make mistakes. Double-check important information.
            </div>
        </div>

    </main>

    <script>
        const form = document.getElementById("form");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const sendButton = document.getElementById("send");

        let conversation = [];

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = text;

            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;

            return message;
        }

        async function sendMessage(event) {
            event.preventDefault();

            const text = input.value.trim();

            if (!text || sendButton.disabled) return;

            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }

            addMessage(text, "user");

            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;

            const loading = addMessage("Thinking...", "ai");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text,
                        history: conversation
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed");
                }

                loading.textContent = data.reply;

                conversation.push(
                    { role: "user", content: text },
                    { role: "assistant", content: data.reply }
                );

            } catch (error) {
                loading.textContent =
                    "Couldn't reach the AI. Check that the server is running and your API key is set up.";
                console.error(error);
            }

            sendButton.disabled = false;
            input.focus();
            chat.scrollTop = chat.scrollHeight;
        }

        function newChat() {
            conversation = [];
            chat.innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>What's on your mind?</h1>
                    <p>
                        Ask questions, learn something new,
                        get help with homework, or just chat.
                    </p>
                </div>
            `;
        }

        form.addEventListener("submit", sendMessage);

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = input.scrollHeight + "px";
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    </script>

</body>
</html>
